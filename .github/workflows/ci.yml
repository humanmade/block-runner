name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      route: ${{ steps.scope.outputs.route }}
      docs: ${{ steps.scope.outputs.docs }}
      base: ${{ steps.scope.outputs.base }}
      head: ${{ steps.scope.outputs.head }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test CI scope classification
        run: node --test dev/test/ci-scope.test.mjs
      - id: scope
        name: Classify changed paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = pull_request ]; then
            base="$PR_BASE"
            head="$PR_HEAD"
          elif [ "$EVENT_NAME" = push ]; then
            base="$PUSH_BEFORE"
            head="$PUSH_AFTER"
          else
            echo "Unsupported event for CI scope classification: $EVENT_NAME" >&2
            exit 1
          fi
          if [ -z "$base" ] || [ -z "$head" ] || [[ "$base" =~ ^0+$ ]] || [[ "$head" =~ ^0+$ ]]; then
            result='{"route":"full","docs":[],"reason":"missing-range-boundary"}'
          else
            result="$(node scripts/ci-scope.mjs --base "$base" --head "$head")"
          fi
          echo "$result"
          route="$(node --input-type=module --eval "console.log(JSON.parse(process.argv[1]).route)" "$result")"
          docs="$(node --input-type=module --eval "console.log(JSON.stringify(JSON.parse(process.argv[1]).docs))" "$result")"
          echo "route=$route" >> "$GITHUB_OUTPUT"
          echo "docs=$docs" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"

  documentation-contracts:
    needs: classify
    if: needs.classify.outputs.route == 'docs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The local-link gate diffs the event's base and head. A rebased PR
          # head does not retain its base in checkout's default shallow clone.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm install -g npm@11
      - run: npm ci --engine-strict
      - name: Verify documentation contracts
        run: npx --no-install vitest run dev/test/skill.test.ts dev/test/node-support.test.ts
      - run: npm run check:private
      - name: Check touched documentation whitespace and local links
        env:
          DOCS: ${{ needs.classify.outputs.docs }}
          BASE: ${{ needs.classify.outputs.base }}
          HEAD: ${{ needs.classify.outputs.head }}
        run: |
          git diff --check "$BASE" "$HEAD"
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync } from 'node:fs';
          import path from 'node:path';

          const docs = JSON.parse(process.env.DOCS ?? '[]');
          for (const document of docs) {
            if (!existsSync(document)) continue;
            const text = readFileSync(document, 'utf8');
            for (const match of text.matchAll(/!?\[[^\]]*\]\(([^)\s]+)(?:\s+[^)]*)?\)/g)) {
              const reference = match[1];
              if (/^(?:[a-z][a-z+.-]*:|#|\/)/i.test(reference)) continue;
              const target = reference.split('#', 1)[0];
              if (target && !existsSync(path.resolve(path.dirname(document), target))) {
                throw new Error(`${document}: missing local Markdown link target ${reference}`);
              }
            }
          }
          NODE
      - name: Verify demo contracts
        run: |
          set -euo pipefail
          bash -n demo/demo.sh
          test -s demo/demo.gif
          test -s assets/benchmark.jpg
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const tape = readFileSync('demo/demo.tape', 'utf8');
          if (!tape.includes('Type `clear; bash demo/demo.sh`')) {
            throw new Error('demo/demo.tape must run demo/demo.sh');
          }
          if (!tape.includes('Output demo/demo.hq.gif') || !tape.includes('Output demo/demo.mp4')) {
            throw new Error('demo/demo.tape must retain its documented output formats');
          }
          NODE

  skill-contracts:
    needs: classify
    if: needs.classify.outputs.route == 'skill'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The local-link gate diffs the event's base and head. A rebased PR
          # head does not retain its base in checkout's default shallow clone.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm install -g npm@11
      - run: npm ci --engine-strict
      - name: Verify documentation and skill CLI contracts
        run: npx --no-install vitest run dev/test/skill.test.ts dev/test/node-support.test.ts dev/test/cli.test.ts
      - run: npm run check:private
      - name: Check touched documentation whitespace and local links
        env:
          DOCS: ${{ needs.classify.outputs.docs }}
          BASE: ${{ needs.classify.outputs.base }}
          HEAD: ${{ needs.classify.outputs.head }}
        run: |
          git diff --check "$BASE" "$HEAD"
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync } from 'node:fs';
          import path from 'node:path';

          const docs = JSON.parse(process.env.DOCS ?? '[]');
          for (const document of docs) {
            if (!existsSync(document)) continue;
            const text = readFileSync(document, 'utf8');
            for (const match of text.matchAll(/!?\[[^\]]*\]\(([^)\s]+)(?:\s+[^)]*)?\)/g)) {
              const reference = match[1];
              if (/^(?:[a-z][a-z+.-]*:|#|\/)/i.test(reference)) continue;
              const target = reference.split('#', 1)[0];
              if (target && !existsSync(path.resolve(path.dirname(document), target))) {
                throw new Error(`${document}: missing local Markdown link target ${reference}`);
              }
            }
          }
          NODE
      - name: Verify the packed skill consumer
        run: |
          test -f dist/cli.js
          npm run smoke:package

  test:
    needs: classify
    if: needs.classify.outputs.route == 'full'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # engines.node: ^20.19.0 || ^22.13.0 || >=24.0.0. These are its exact
        # lowest releases; the 21.x and 23.x lines are intentionally unsupported
        # by the resolved jsdom graph.
        node: [20.19.0, 22.13.0, 24.0.0]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Pin npm 11: lockfile is npm-10/11 compatible; npm 12 needs newer Node
      # and changed `npm pack --json` shape (handled in check-private-refs, but
      # avoid `npm@latest` floating across majors on the matrix).
      - run: npm install -g npm@11
      - run: npm ci --engine-strict
      - name: Verify
        run: npm run verify
      - name: Smoke the packed CLI in a clean engine-strict consumer
        run: npm run smoke:package
      - name: Reject unsupported Node before packed CLI dependencies load
        if: matrix.node == '20.19.0'
        run: npm run smoke:package:unsupported-node

  package-boundary:
    needs: classify
    if: needs.classify.outputs.route == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run build
      - name: Verify basic and proof-enabled packed consumers
        run: npm run test:package
      - name: Verify clean consumer archive builds
        run: npm run test:consumer

  wordpress-proof:
    needs: classify
    if: needs.classify.outputs.route == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm install -g npm@11
      - run: npm ci --engine-strict
      - run: npx --no-install playwright install --with-deps chromium
      - name: Collect native WordPress Heading and Paragraph controls
        env:
          BLOCK_RUNNER_NATIVE_HEADING_CONTROL_OUTPUT_DIR: ${{ runner.temp }}/block-runner-wordpress-7.1-receipt/native-heading-control
          BLOCK_RUNNER_NATIVE_PARAGRAPH_CONTROL_OUTPUT_DIR: ${{ runner.temp }}/block-runner-wordpress-7.1-receipt/native-paragraph-control
          BLOCK_RUNNER_NATIVE_HEADING_CONTROL_KEEP: '1'
          BLOCK_RUNNER_NATIVE_PARAGRAPH_CONTROL_KEEP: '1'
        run: |
          npm run proof:control -- --block heading --output-dir "$BLOCK_RUNNER_NATIVE_HEADING_CONTROL_OUTPUT_DIR"
          npm run proof:control -- --block paragraph --output-dir "$BLOCK_RUNNER_NATIVE_PARAGRAPH_CONTROL_OUTPUT_DIR"
      - name: Bind native control evidence to the acceptance test
        run: |
          cat "${{ runner.temp }}/block-runner-wordpress-7.1-receipt/native-heading-control/github-env.txt" >> "$GITHUB_ENV"
          cat "${{ runner.temp }}/block-runner-wordpress-7.1-receipt/native-paragraph-control/github-env.txt" >> "$GITHUB_ENV"
      - name: Verify generated-plugin automated acceptance in WordPress 7.1
        env:
          BLOCK_RUNNER_PROOF_OUTPUT_DIR: ${{ runner.temp }}/block-runner-wordpress-7.1-receipt
          BLOCK_RUNNER_PROOF_ACCEPTANCE: required
        run: npm run test:proof:wordpress
      - name: Stop WordPress proof environment
        if: always()
        run: npx --no-install wp-env --config=proof/wp-env.json stop
      - name: Upload WordPress 7.1 pattern-overrides receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-7.1-pattern-overrides-receipt
          path: |
            ${{ runner.temp }}/block-runner-wordpress-7.1-receipt
            !${{ runner.temp }}/block-runner-wordpress-7.1-receipt/**/node_modules/**
          if-no-files-found: warn
          retention-days: 14

  ci-scope:
    name: CI scope
    if: always()
    needs: [classify, documentation-contracts, skill-contracts, test, package-boundary, wordpress-proof]
    runs-on: ubuntu-latest
    steps:
      - name: Require the selected route and accept only intentional skips
        env:
          CLASSIFY: ${{ needs.classify.result }}
          ROUTE: ${{ needs.classify.outputs.route }}
          DOCS: ${{ needs.documentation-contracts.result }}
          SKILL: ${{ needs.skill-contracts.result }}
          TEST: ${{ needs.test.result }}
          PACKAGE_BOUNDARY: ${{ needs.package-boundary.result }}
          WORDPRESS_PROOF: ${{ needs.wordpress-proof.result }}
        run: |
          set -euo pipefail
          if [ "$CLASSIFY" != success ]; then
            echo "Path classifier did not succeed: $CLASSIFY"
            exit 1
          fi
          case "$ROUTE" in
            docs)
              selected="$DOCS"
              skipped="$SKILL $TEST $PACKAGE_BOUNDARY $WORDPRESS_PROOF"
              ;;
            skill)
              selected="$SKILL"
              skipped="$DOCS $TEST $PACKAGE_BOUNDARY $WORDPRESS_PROOF"
              ;;
            full)
              selected="$TEST $PACKAGE_BOUNDARY $WORDPRESS_PROOF"
              skipped="$DOCS $SKILL"
              ;;
            *)
              echo "Classifier produced an invalid route: $ROUTE"
              exit 1
              ;;
          esac
          for result in $selected; do
            if [ "$result" != success ]; then
              echo "Selected CI job did not succeed: $result"
              exit 1
            fi
          done
          for result in $skipped; do
            if [ "$result" != skipped ]; then
              echo "Unselected CI job was not intentionally skipped: $result"
              exit 1
            fi
          done
