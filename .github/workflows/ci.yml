name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 18 is EOL; keep in step with engines (>=20).
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Pin npm 11: lockfile is npm-10/11 compatible; npm 12 needs newer Node
      # and changed `npm pack --json` shape (handled in check-private-refs, but
      # avoid `npm@latest` floating across majors on the matrix).
      - run: npm install -g npm@11
      - run: npm ci
      - name: Verify
        env:
          # The real WordPress test writes the immutable receipt, its evidence,
          # and a receipt-index.json pointer here for the artifact below.
          BLOCK_RUNNER_PROOF_OUTPUT_DIR: ${{ runner.temp }}/block-runner-wordpress-7.1-receipt
        run: npm run verify
      - name: Upload WordPress 7.1 pattern-overrides receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-7.1-pattern-overrides-receipt-node-${{ matrix.node }}
          path: ${{ runner.temp }}/block-runner-wordpress-7.1-receipt
          if-no-files-found: warn
          retention-days: 14
