name: Release

# Publishes to npm with provenance via Trusted Publishing (OIDC) — no long-lived
# NPM_TOKEN in the repo. Triggered by publishing a GitHub Release, which acts as
# the manual gate. One-time npm-side setup is required first: see RELEASING.md.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for provenance attestation + trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.23.4
          registry-url: https://registry.npmjs.org
      # npm 12 supports Trusted Publishing on the patched Node baseline.
      - run: npm install -g npm@12.2.1
      - run: npm ci --engine-strict
      - name: Verify benchmark and evidence tooling
        run: npm run test:tools
      - run: npx --no-install playwright install --with-deps chromium
      - name: Collect native WordPress Heading control
        env:
          BLOCK_RUNNER_NATIVE_HEADING_CONTROL_OUTPUT_DIR: ${{ runner.temp }}/block-runner-wordpress-7.1-release-control
          BLOCK_RUNNER_NATIVE_HEADING_CONTROL_KEEP: '1'
        run: npm run proof:control -- --output-dir "$BLOCK_RUNNER_NATIVE_HEADING_CONTROL_OUTPUT_DIR"
      - name: Collect native WordPress Paragraph control
        run: npm run proof:control -- --block paragraph --keep-environment --output-dir "${{ runner.temp }}/block-runner-wordpress-7.1-release-control/paragraph"
      - name: Bind native control evidence to the release check
        run: |
          cat "${{ runner.temp }}/block-runner-wordpress-7.1-release-control/github-env.txt" >> "$GITHUB_ENV"
          cat "${{ runner.temp }}/block-runner-wordpress-7.1-release-control/paragraph/github-env.txt" >> "$GITHUB_ENV"
      - name: Run the receipt-backed release candidate matrix
        # No --plans is intentional: the optional registered-block authoring
        # benchmark remains pending/unscored and is not a release prerequisite.
        run: npm run release:check -- --matrix full-release-matrix --manual-review proof/reviews/1.0.0/agent-review.json --receipt "dev/release/0.9-testing/receipts/${RELEASE_RECEIPT_TAG}.json"
        env:
          # Release names are data, never shell syntax. Keep the expansion
          # quoted so valid Git tag punctuation cannot alter this command.
          RELEASE_RECEIPT_TAG: ${{ github.event.release.tag_name }}
      - name: Stop WordPress proof environment
        if: always()
        run: npx --no-install wp-env --config=proof/wp-env.json stop
      - name: Retain release receipts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-receipts-${{ github.event.release.tag_name }}
          path: |
            dev/release/0.9-testing/receipts/
            !dev/release/0.9-testing/receipts/**/node_modules/**
            ${{ runner.temp }}/block-runner-wordpress-7.1-release-control/
          if-no-files-found: warn
      - name: Publish release
        run: npm publish --provenance --access public --tag latest
        # No NODE_AUTH_TOKEN: Trusted Publishing authenticates via OIDC.
        # Provenance is generated automatically; --provenance makes intent explicit.
