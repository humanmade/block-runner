<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Aurora release dashboard</title>
  <desc id="desc">A dark dashboard with color tokens, a release receipt list, and an activation check marked complete.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172554"/><stop offset="1" stop-color="#312e81"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#c4b5fd"/></linearGradient>
  </defs>
  <rect width="960" height="640" rx="32" fill="url(#bg)"/>
  <circle cx="810" cy="74" r="180" fill="#22d3ee" opacity=".13"/>
  <rect x="56" y="56" width="848" height="528" rx="20" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <rect x="88" y="92" width="210" height="38" rx="10" fill="#1e293b"/>
  <circle cx="112" cy="111" r="8" fill="#67e8f9"/><rect x="132" y="103" width="130" height="16" rx="8" fill="#cbd5e1" opacity=".8"/>
  <text x="88" y="180" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="32" font-weight="700">Release evidence</text>
  <text x="88" y="212" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="18">Authoring package · block runner 0.9</text>
  <rect x="88" y="254" width="330" height="130" rx="16" fill="#172554" stroke="#334155"/>
  <text x="116" y="292" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="16">STYLE TOKENS</text>
  <circle cx="128" cy="334" r="18" fill="#67e8f9"/><circle cx="180" cy="334" r="18" fill="#a78bfa"/><circle cx="232" cy="334" r="18" fill="#fbbf24"/>
  <rect x="458" y="254" width="390" height="236" rx="16" fill="#172554" stroke="#334155"/>
  <text x="486" y="292" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="16">RELEASE RECEIPTS</text>
  <g font-family="system-ui, sans-serif" font-size="18"><circle cx="494" cy="332" r="11" fill="#34d399"/><path d="m488 332 4 4 8-9" fill="none" stroke="#052e16" stroke-width="3" stroke-linecap="round"/><text x="518" y="338" fill="#f8fafc">Source contract</text><circle cx="494" cy="376" r="11" fill="#34d399"/><path d="m488 376 4 4 8-9" fill="none" stroke="#052e16" stroke-width="3" stroke-linecap="round"/><text x="518" y="382" fill="#f8fafc">Package dry run</text><circle cx="494" cy="420" r="11" fill="#34d399"/><path d="m488 420 4 4 8-9" fill="none" stroke="#052e16" stroke-width="3" stroke-linecap="round"/><text x="518" y="426" fill="#f8fafc">ZIP activation</text></g>
  <rect x="88" y="430" width="330" height="78" rx="14" fill="url(#glow)"/>
  <text x="116" y="478" fill="#082f49" font-family="system-ui, sans-serif" font-size="21" font-weight="700">Activation: complete</text>
</svg>
